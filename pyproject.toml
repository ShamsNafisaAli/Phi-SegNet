[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phisegnet"
version = "0.1.0"
description = "PyTorch implementation of Phi-SegNet for medical image segmentation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.23.0",
    "Pillow>=9.0.0",
    "opencv-python>=4.7.0",
    "scipy>=1.9.0",
    "tqdm>=4.64.0",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["phisegnet*"]
